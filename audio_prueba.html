<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AudioSOAP - Prueba</title>
    <style>
        body { font-family: Arial; padding: 20px; max-width: 500px; margin: auto; }
        button { padding: 15px 30px; font-size: 18px; margin: 5px; }
        #grabar { background: #28a745; color: white; }
        #detener { background: #dc3545; color: white; display: none; }
        #estado { margin: 10px 0; font-weight: bold; }
        #resultado { background: #f8f9fa; padding: 15px; border-radius: 8px; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h1>🎙️ AudioSOAP</h1>
    <button id="grabar">🎤 Grabar</button>
    <button id="detener">⏹ Detener</button>
    <p id="estado">Presione Grabar</p>
    <div id="resultado"></div>

    <script>
        const grabarBtn = document.getElementById('grabar');
        const detenerBtn = document.getElementById('detener');
        const estado = document.getElementById('estado');
        const resultado = document.getElementById('resultado');

        let mediaRecorder = null;
        let chunks = [];

        grabarBtn.onclick = async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                chunks = [];

                mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) chunks.push(e.data);
                };

                mediaRecorder.onstop = async () => {
                    estado.innerText = '⏳ Procesando...';
                    const blob = new Blob(chunks, { type: 'audio/webm' });
                    const formData = new FormData();
                    formData.append('audio', blob, 'consulta.webm');

                    // Aquí debes cambiar la URL por tu backend real (si lo tienes en la nube)
                    // Para probar, usamos un backend de prueba (no funciona realmente, solo simula)
                    try {
                        // Simulación: muestra un texto de ejemplo
                        setTimeout(() => {
                            resultado.innerHTML = `
                                <b>📋 Nota SOAP (simulada)</b><br>
                                <b>Subjetivo:</b> Paciente refiere ansiedad y tensión muscular.<br>
                                <b>Objetivo:</b> Sin alteraciones físicas.<br>
                                <b>Evaluación:</b> Ansiedad moderada (GAD-7: 12).<br>
                                <b>Plan:</b> Psicoeducación y técnicas de relajación.<br><br>
                                <b>👨‍👩‍👧‍👦 Resumen para la familia:</b><br>
                                El paciente presenta ansiedad por estrés laboral. Se recomienda acompañamiento familiar.
                            `;
                            estado.innerText = '✅ Simulación completada.';
                        }, 2000);
                    } catch (e) {
                        estado.innerText = '❌ Error: ' + e.message;
                    }
                };

                mediaRecorder.start();
                grabarBtn.disabled = true;
                detenerBtn.style.display = 'inline';
                estado.innerText = '🔴 Grabando...';
            } catch (e) {
                alert('Error al acceder al micrófono: ' + e.message);
            }
        };

        detenerBtn.onclick = () => {
            if (mediaRecorder) {
                mediaRecorder.stop();
                mediaRecorder.stream.getTracks().forEach(t => t.stop());
                grabarBtn.disabled = false;
                detenerBtn.style.display = 'none';
                estado.innerText = '⏹ Grabación detenida.';
            }
        };
    </script>
</body>
  </html>
